<svg xmlns="http://www.w3.org/2000/svg" width="840" height="798" viewBox="0 0 840 798" role="img" aria-labelledby="title description">
<title id="title">Digital PDF conversion comparison</title>
<desc id="description">Quality score, pdfvision: 98 / 100. Quality score, anydoc: 61 / 100. Quality score, markitdown: 64 / 100. Conversion completion, pdfvision: 99.3% (6454/6498). Conversion completion, anydoc: 90.7% (5892/6498). Conversion completion, markitdown: 100.0% (6498/6498). Median conversion time, pdfvision: 4.57 ms. Median conversion time, anydoc: 2.42 ms. Median conversion time, markitdown: 59.53 ms. All bar axes start at zero. Speed uses only documents converted by every tool.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.heading{font-size:20px;font-weight:650}.tool{font-size:16px;font-weight:600}.value{font-size:14px}.note{font-size:13px;fill:#475569}</style>
